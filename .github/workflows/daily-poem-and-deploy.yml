name: Daily poem and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
      - "public/generated/visuals/**"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate today's poem even if it already exists"
        required: false
        default: false
        type: boolean
      target_date:
        description: "Optional date to generate, in YYYY-MM-DD format"
        required: false
        default: ""
        type: string
  schedule:
    # GitHub schedule uses UTC. 05:07 UTC = 08:07 Europe/Istanbul.
    - cron: "7 5 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ucu-beden-generation-and-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Log schedule timing
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          TARGET_CRON_UTC: "7 5 * * *"
          TARGET_LOCAL_TIME: "08:07 Europe/Istanbul"
        run: |
          node <<'NODE'
          const now = new Date();
          const schedule = process.env.GITHUB_EVENT_SCHEDULE || "manual_or_push";
          const targetCron = process.env.TARGET_CRON_UTC;
          const targetLocalTime = process.env.TARGET_LOCAL_TIME;
          const localParts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Europe/Istanbul",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }).formatToParts(now);
          const part = (type) => localParts.find((item) => item.type === type)?.value;
          const localGenerationDate = `${part("year")}-${part("month")}-${part("day")}`;
          const runStartedIstanbul = `${localGenerationDate}T${part("hour")}:${part("minute")}:${part("second")}+03:00`;
          const [minute, hour] = targetCron.split(" ").map(Number);
          const scheduledUtc = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), hour, minute));
          const delayMinutes = Math.round((now.getTime() - scheduledUtc.getTime()) / 60000);
          const payload = {
            run_started_utc: now.toISOString(),
            run_started_europe_istanbul: runStartedIstanbul,
            target_local_time: targetLocalTime,
            local_generation_date: localGenerationDate,
            "github.event.schedule": schedule,
            schedule_delay_minutes: schedule === "manual_or_push" ? null : delayMinutes
          };
          console.log(JSON.stringify(payload, null, 2));
          if (schedule !== "manual_or_push" && delayMinutes > 20) {
            console.log(`::warning::Scheduled run started ${delayMinutes} minutes after ${targetLocalTime}; continuing generation.`);
          }
          NODE
      - name: Generate daily life, poem, and poem visual
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          OPENAI_IMAGE_FORMAT: ${{ vars.OPENAI_IMAGE_FORMAT }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || false }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then DATE_ARG="--date=$TARGET_DATE"; fi
          if [ "$FORCE_REGENERATE" = "true" ]; then npm run generate:today -- $DATE_ARG --force; else npm run generate:today -- $DATE_ARG; fi
      - name: Backfill missing poem and dream visuals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
          OPENAI_IMAGE_FORMAT: ${{ vars.OPENAI_IMAGE_FORMAT }}
        run: npm run backfill:visuals -- --limit=4
      - name: Commit and push morning data
        run: |
          if git diff --quiet -- data public/generated/visuals; then echo "No generated data changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AGE=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/state/ucu_beden_state.json','utf8')); console.log(s.age_months + ' ay')")
          git add data public/generated/visuals
          git commit -m "UCU BEDEN / ${AGE} / sabah kaydı"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - run: git pull
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
