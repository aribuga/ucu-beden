name: Daily poem and deploy

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate today's poem even if it already exists"
        required: false
        default: false
        type: boolean
      target_date:
        description: "Optional date to generate, in YYYY-MM-DD format"
        required: false
        default: ""
        type: string
  schedule:
    # GitHub can delay or drop schedules at the top of the hour.
    # 06:17 UTC = 09:17 Europe/Istanbul; later runs are backups.
    - cron: "17 6 * * *"
    - cron: "47 6 * * *"
    - cron: "10 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate poem
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          FORCE_REGENERATE: ${{ github.event.inputs.force_regenerate || false }}
          TARGET_DATE: ${{ github.event.inputs.target_date || '' }}
        run: |
          DATE_ARG=""
          if [ -n "$TARGET_DATE" ]; then
            DATE_ARG="--date=$TARGET_DATE"
          fi

          if [ "$FORCE_REGENERATE" = "true" ]; then
            npm run generate:today -- $DATE_ARG --force
          else
            npm run generate:today -- $DATE_ARG
          fi

      - name: Commit generated data
        run: |
          if git diff --quiet -- data; then
            echo "No generated data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AGE=$(node -e "const fs=require('fs'); const s=JSON.parse(fs.readFileSync('data/state/ucu_beden_state.json','utf8')); console.log(s.age_months + ' ay')")
          git add data
          git commit -m "UCU BEDEN / ${AGE} / sabah kaydı"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Pull generated data
        run: git pull

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
